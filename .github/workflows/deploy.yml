cat > .github/workflows/deploy.yml << 'EOF'
   name: Deploy

   on:
     push:
       branches:
         - stage
       paths:
         - 'service-*/**'
     workflow_dispatch:
       inputs:
         service_path:
           description: "Service folder to deploy (e.g. service-one). Leave empty to auto-detect from last commit."
           required: false
           type: string

   jobs:
     deploy:
       uses: nurixlabs/hack-central-apr-26/.github/workflows/deploy.yml@stage
       secrets: inherit
   EOF