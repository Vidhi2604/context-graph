helmReleaseName: context-mesh
namespace: team-latency-labs
helmChart: ./helm/nurix-service

dockerfilePath: ./helm/nextjs-service.Dockerfile
docker:
  buildArgs:
    PORT: "3000"

ingress:
  enabled: true
  scheme: "internet-facing"
  listenPorts: '[{"HTTP": 80},{"HTTPS": 443}]'
  hosts:
    - host: "context-mesh.hack.nurixlabs.tech"
      paths:
        - path: /
          pathType: Prefix

service:
  targetPort: 3000

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"

replicaCount: 1
