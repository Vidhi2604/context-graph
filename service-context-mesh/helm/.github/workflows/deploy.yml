name: Deploy
permissions:
  contents: read
  id-token: write
on:
  push:
    branches:
      - stage
    paths:
      - 'service-*/**'
  workflow_dispatch:
    inputs:
      service_path:
        description: "Service folder to deploy (e.g. service-one). Leave empty to auto-detect from last commit."
        required: false
        type: string
jobs:
  deploy:
    uses: nurixlabs/hack-central-apr-26/.github/workflows/deploy.yml@stage
    with:
      service_path: ${{ github.event.inputs.service_path || '' }}
    secrets: inherit
